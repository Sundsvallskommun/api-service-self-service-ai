#========================================
# General settings
#========================================
logging:
  level:
    root: INFO
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
spring:
  application:
    name: self-service-ai
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    properties:
      hibernate:
        format_sql: true
        auto_quote_keyword: true
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
  flyway:
    baseline-on-migrate: true
    enabled: false
  security:
    oauth2:
      client:
        registration:
          eneo:
            authorization-grant-type: client_credentials
            provider: eneo
          agreement:
            authorization-grant-type: client_credentials
            provider: agreement
          installedbase:
            authorization-grant-type: client_credentials
            provider: installedbase
          invoices:
            authorization-grant-type: client_credentials
            provider: invoices
          lime:
            authorization-grant-type: client_credentials
            provider: lime
          measurement-data:
            authorization-grant-type: client_credentials
            provider: measurement-data

integration:
  agreement:
    connect-timeout-in-seconds: 5
    read-timeout-in-seconds: 60
  installedbase:
    connect-timeout-in-seconds: 5
    read-timeout-in-seconds: 60
  invoices:
    connect-timeout-in-seconds: 5
    read-timeout-in-seconds: 60
    organization-numbers:
      - "5564786647"
      - "5565027223"
  eneo:
    connect-timeout-in-seconds: 5
    read-timeout-in-seconds: 60
  lime:
    connect-timeout-in-seconds: 5
    read-timeout-in-seconds: 60
  measurement-data:
    connect-timeout-in-seconds: 5
    read-timeout-in-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      agreement:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      installedbase:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      invoices:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      eneo:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      lime:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
      measurement-data:
        ignoreExceptions: se.sundsvall.dept44.exception.ClientProblem
logbook:
  body-filters:
    allowlist:
      paths:
        # Eneo errors
        - '$.message'
        - '$.eneo_error_code'
        - '$.code'
        - '$.request_id'
        - '$.details.file_id'
        - '$.details.can_delete'
        - '$.details.affected_file_count'
        - '$.details.blockers[*].kind'
        - '$.details.blockers[*].count'
        # Chat session, at the root when read from Eneo and under chatSession when sent to Lime
        - '$.id'
        - '$.created_at'
        - '$.updated_at'
        - '$.feedback.value'
        - '$.chatSession.id'
        - '$.chatSession.created_at'
        - '$.chatSession.updated_at'
        - '$.chatSession.feedback.value'
        - '$..messages[*].id'
        - '$..messages[*].created_at'
        - '$..messages[*].updated_at'
        - '$..messages[*].files[*].id'
        - '$..messages[*].files[*].created_at'
        - '$..messages[*].files[*].updated_at'
        - '$..messages[*].files[*].mimetype'
        - '$..messages[*].files[*].size'
        - '$..messages[*].tools.assistants[*].id'
        - '$..messages[*].tools.assistants[*].handle'
        - '$..completion_model.id'
        - '$..completion_model.created_at'
        - '$..completion_model.updated_at'
        - '$..completion_model.name'
        - '$..completion_model.nickname'
        - '$..completion_model.family'
        - '$..completion_model.token_limit'
        - '$..completion_model.is_deprecated'
        - '$..completion_model.nr_billion_parameters'
        - '$..completion_model.hf_link'
        - '$..completion_model.stability'
        - '$..completion_model.hosting'
        - '$..completion_model.open_source'
        - '$..completion_model.description'
        - '$..completion_model.deployment_name'
        - '$..completion_model.org'
        - '$..completion_model.vision'
        - '$..completion_model.reasoning'
        - '$..completion_model.base_url'
        - '$..completion_model.is_org_enabled'
        - '$..completion_model.is_org_default'
